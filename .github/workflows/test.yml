name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Checar tipos
        run: bunx tsc --noEmit

      - name: Rodar testes
        run: bun test
