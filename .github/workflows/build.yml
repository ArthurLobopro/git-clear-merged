name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar binários e publicar release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Conferir tag x versão do package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Rodar testes
        run: bun test

      - name: Compilar binários (linux-x64 e linux-arm64)
        run: bun run build:release

      - name: Smoke test do binário x64
        run: |
          test "$(dist/git-clean-merged-linux-x64 --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Gerar checksums SHA-256
        working-directory: dist
        run: sha256sum git-clean-merged-linux-* > SHA256SUMS

      - name: Enviar binários como artefato
        uses: actions/upload-artifact@v4
        with:
          name: git-clean-merged
          path: |
            dist/git-clean-merged-linux-*
            dist/SHA256SUMS

      - name: Publicar release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/git-clean-merged-linux-* dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
